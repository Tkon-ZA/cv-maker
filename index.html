<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منشئ السيرة الذاتية (ATS)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; display: flex; height: 100vh; background-color: #f4f7f6; color: #333; overflow: hidden;}
        .editor-panel { width: 45%; padding: 25px; background-color: #ffffff; box-shadow: -2px 0 10px rgba(0,0,0,0.1); overflow-y: auto; }
        .editor-panel h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .section-title { font-size: 18px; color: #34495e; margin-top: 25px; margin-bottom: 15px; font-weight: bold; }
        .form-row { display: flex; gap: 15px; margin-bottom: 12px; }
        .form-row .form-group { flex: 1; margin-bottom: 0; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 13px; color: #555; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: #3498db; outline: none; }
        .dynamic-box { border: 1px dashed #bdc3c7; padding: 15px; margin-bottom: 15px; border-radius: 5px; position: relative; background: #fafafa;}
        .remove-btn { position: absolute; top: 10px; left: 10px; background: #e74c3c; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; font-size: 12px; }
        .add-btn { background: #3498db; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-size: 13px; margin-bottom: 20px; }
        .btn-download { display: block; width: 100%; padding: 15px; background-color: #2ecc71; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 30px; margin-bottom: 50px;}
        .btn-download:hover { background-color: #27ae60; }
        .preview-panel { width: 55%; padding: 30px; display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; background-color: #e0e6ed; }
        
        /* قوالب الـ ATS */
        .resume-page { width: 210mm; min-height: 297mm; background: white; padding: 20mm; box-shadow: 0 0 10px rgba(0,0,0,0.2); box-sizing: border-box; }
        .item-row { margin-bottom: 12px; }
        .item-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; }
        .item-sub { font-style: italic; font-size: 13px; margin-bottom: 4px; color: #555; }
        .item-desc { font-size: 13px; margin: 0; line-height: 1.5; }
        .skills-list { font-size: 13px; line-height: 1.6; margin: 0; padding: 0 20px; }

        .t-classic { font-family: 'Times New Roman', Times, serif; color: #000; }
        .t-classic h1 { text-align: center; font-size: 26px; border-bottom: 2px solid #000; margin:0 0 10px 0; padding-bottom: 10px; }
        .t-classic .contact-info { text-align: center; font-size: 14px; margin-bottom: 20px; }
        .t-classic .resume-section h3 { font-size: 16px; border-bottom: 1px solid #000; padding-bottom: 3px; margin-bottom: 10px; }
        
        .t-modern { font-family: 'Segoe UI', Arial, sans-serif; color: #333; }
        .t-modern h1 { font-size: 28px; margin: 0; color: #2c3e50; font-weight: 800; }
        .t-modern .contact-info { font-size: 13px; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #3498db; color: #7f8c8d; }
        .t-modern .resume-section h3 { font-size: 15px; color: #2980b9; border-bottom: 1px solid #ecf0f1; padding-bottom: 5px; margin-bottom: 12px; }

        .t-executive { font-family: Georgia, serif; color: #222; }
        .t-executive h1 { font-size: 30px; margin: 0 0 10px 0; color: #34495e; }
        .t-executive .contact-info { border-top: 1px solid #ccc; border-bottom: 1px solid #ccc; padding: 10px 0; margin-bottom: 20px; font-size: 13px; }
        .t-executive .resume-section h3 { background-color: #f1f2f6; padding: 5px 10px; font-size: 14px; margin-bottom: 15px; color: #2f3640; }

        @media print {
            body { background: white; display: block; margin: 0; overflow: visible;}
            .editor-panel { display: none !important; }
            .preview-panel { width: 100%; padding: 0; background: white; display: block; }
            .resume-page { box-shadow: none; width: 100%; padding: 20mm; }
        }
    </style>
</head>
<body>

    <div class="editor-panel" oninput="updatePreview()" onchange="updatePreview()">
        <h2>إعدادات السيرة الذاتية</h2>
        
        <div class="form-row">
            <div class="form-group">
                <label>اختر القالب</label>
                <select id="cv-template">
                    <option value="t-classic">1. الكلاسيكي (Classic)</option>
                    <option value="t-modern">2. الحديث (Modern)</option>
                    <option value="t-executive">3. التنفيذي (Executive)</option>
                </select>
            </div>
            <div class="form-group">
                <label>اللغة</label>
                <select id="cv-language">
                    <option value="en">English</option>
                    <option value="ar">العربية</option>
                </select>
            </div>
        </div>

        <div class="section-title">المعلومات الشخصية</div>
        <div class="form-group"><input type="text" id="inp-name" placeholder="الاسم الكامل"></div>
        <div class="form-group"><input type="text" id="inp-title" placeholder="المسمى الوظيفي"></div>
        <div class="form-group"><input type="text" id="inp-contact" placeholder="البريد | الهاتف | المدينه"></div>
        <div class="form-group"><textarea id="inp-summary" rows="3" placeholder="الملخص المهني"></textarea></div>

        <div class="section-title">خبرات العمل</div>
        <div id="jobs-container"></div>
        <button class="add-btn" onclick="addJob()">+ إضافة خبرة</button>

        <div class="section-title">التعليم</div>
        <div id="edu-container"></div>
        <button class="add-btn" onclick="addEdu()">+ إضافة تعليم</button>

        <div class="section-title">المهارات</div>
        <div class="form-group"><textarea id="inp-skills" rows="3" placeholder="أدخل المهارات مفصولة بفاصلة"></textarea></div>

        <button class="btn-download" onclick="window.print()">حفظ كملف PDF</button>
    </div>

    <div class="preview-panel">
        <div class="resume-page t-classic" id="cv-preview"></div>
    </div>

    <script>
        function getJobHTML(id) {
            return `<div class="dynamic-box job-entry" id="job-${id}"><button class="remove-btn" onclick="removeEl('job-${id}')">حذف</button><div class="form-group"><input type="text" class="j-title" placeholder="المسمى"></div><div class="form-group"><input type="text" class="j-company" placeholder="الشركة"></div><div class="form-group"><input type="text" class="j-date" placeholder="التاريخ"></div><div class="form-group"><textarea class="j-desc" rows="2" placeholder="المهام..."></textarea></div></div>`;
        }
        function getEduHTML(id) {
            return `<div class="dynamic-box edu-entry" id="edu-${id}"><button class="remove-btn" onclick="removeEl('edu-${id}')">حذف</button><div class="form-group"><input type="text" class="e-degree" placeholder="الدرجة"></div><div class="form-group"><input type="text" class="e-school" placeholder="الجامعة"></div><div class="form-group"><input type="text" class="e-date" placeholder="السنة"></div></div>`;
        }
        let jobId = 0, eduId = 0;
        function addJob() { document.getElementById('jobs-container').insertAdjacentHTML('beforeend', getJobHTML(jobId++)); updatePreview(); }
        function addEdu() { document.getElementById('edu-container').insertAdjacentHTML('beforeend', getEduHTML(eduId++)); updatePreview(); }
        function removeEl(id) { document.getElementById(id).remove(); updatePreview(); }

        function updatePreview() {
            const lang = document.getElementById('cv-language').value;
            const template = document.getElementById('cv-template').value;
            const isAr = (lang === 'ar');
            const cvPage = document.getElementById('cv-preview');
            cvPage.setAttribute('dir', isAr ? 'rtl' : 'ltr');
            cvPage.className = `resume-page ${template}`;

            const name = document.getElementById('inp-name').value || 'الاسم الكامل';
            const title = document.getElementById('inp-title').value || 'المسمى الوظيفي';
            const contact = document.getElementById('inp-contact').value || 'البريد | الهاتف | المدينة';
            const summary = document.getElementById('inp-summary').value || 'ملخص مهني يبرز أهم مهاراتك.';
            
            let jobsHTML = '', eduHTML = '';
            document.querySelectorAll('.job-entry').forEach(job => {
                jobsHTML += `<div class="item-row"><div class="item-header"><span>${job.querySelector('.j-title').value || 'المسمى'}</span><span>${job.querySelector('.j-date').value || 'التاريخ'}</span></div><div class="item-sub">${job.querySelector('.j-company').value || 'الشركة'}</div><p class="item-desc">${job.querySelector('.j-desc').value.replace(/\n/g, '<br>') || 'المهام...'}</p></div>`;
            });
            document.querySelectorAll('.edu-entry').forEach(edu => {
                eduHTML += `<div class="item-row"><div class="item-header"><span>${edu.querySelector('.e-degree').value || 'الدرجة'}</span><span>${edu.querySelector('.e-date').value || 'السنة'}</span></div><div class="item-sub">${edu.querySelector('.e-school').value || 'الجامعة'}</div></div>`;
            });

            let htmlContent = `<h1>${name}</h1><div class="contact-info">${contact}<br><b>${title}</b></div><div class="resume-section"><h3>الملخص</h3><p class="item-desc">${summary}</p></div>`;
            if (jobsHTML) htmlContent += `<div class="resume-section"><h3>الخبرات</h3>${jobsHTML}</div>`;
            if (eduHTML) htmlContent += `<div class="resume-section"><h3>التعليم</h3>${eduHTML}</div>`;
            
            const skillsRaw = document.getElementById('inp-skills').value;
            let skillsHTML = '';
            if (skillsRaw) {
                const skillsArray = skillsRaw.split(',').map(s => s.trim()).filter(s => s !== '');
                skillsHTML = `<ul class="skills-list">` + skillsArray.map(s => `<li>${s}</li>`).join('') + `</ul>`;
            } else {
                skillsHTML = `<ul class="skills-list"><li>مهارة 1</li><li>مهارة 2</li></ul>`;
            }
            htmlContent += `<div class="resume-section"><h3>المهارات</h3>${skillsHTML}</div>`;
            cvPage.innerHTML = htmlContent;
        }
        addJob(); addEdu();
    </script>
</body>
</html>
